name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (editable + dev extras)
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check aether_context tests
      - name: Types (mypy)
        run: python -m mypy aether_context
      - name: Tests
        run: python -m pytest -q --cov=aether_context --cov-report=term-missing
      - name: Bench smoke (hermetic mock model)
        run: python bench/drift_vs_window.py --model mock --quick

  npm-launcher:
    name: npm launcher
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/npm-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The launcher ships as plain CommonJS with no build step, so `node --check` is the whole
      # compile stage: a syntax error here would otherwise only surface on a user's first run.
      - name: Syntax check
        run: node --check bin/aether-context.js
      # Proves `files` and `bin` agree with what is on disk before the tarball ever reaches npm.
      - name: Pack and list the tarball
        run: |
          npm pack --silent
          tar -tzf aether-context-*.tgz

  numpy-matrix:
    name: numpy ${{ matrix.numpy }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pair each numpy with an interpreter it actually ships wheels for. numpy 1.24
        # (our declared floor) stops at cp311 — on 3.12 pip finds no distribution and
        # falls back to a source build that fails.
        include:
          - numpy: "1.24.*"
            python-version: "3.11"
          - numpy: "1.26.*"
            python-version: "3.12"
          - numpy: "2.*"
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]" "numpy==${{ matrix.numpy }}"
      - run: python -m pytest -q
