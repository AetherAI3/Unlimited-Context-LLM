[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-context"
dynamic = ["version"]
description = "Unlimited Context — virtual memory for an LLM's attention. Local-first, numpy-only core."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "Aether AI" }]
maintainers = [{ name = "Aether AI" }]
keywords = ["llm", "context", "retrieval", "ollama", "local", "rag", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24,<3.0"]       # CORE = numpy only. Works offline with MockLLM.

[project.urls]
Homepage = "https://github.com/AetherAI3/Unlimited-Context-LLM"
Repository = "https://github.com/AetherAI3/Unlimited-Context-LLM.git"
Documentation = "https://github.com/AetherAI3/Unlimited-Context-LLM#readme"
Issues = "https://github.com/AetherAI3/Unlimited-Context-LLM/issues"
Changelog = "https://github.com/AetherAI3/Unlimited-Context-LLM/blob/main/CHANGELOG.md"

[project.optional-dependencies]
ollama   = []                              # primary path uses stdlib urllib — no extra dep needed
llamacpp = ["llama-cpp-python>=0.2"]
hf       = ["transformers>=4.40", "torch>=2.2"]
fast     = ["hnswlib>=0.8"]                # faster ANN; flat numpy index is the fallback
all      = ["aether-context[llamacpp,hf,fast]"]
dev      = ["pytest>=8", "pytest-cov", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
aether-context = "aether_context.cli:main"

[tool.setuptools.dynamic]
version = { attr = "aether_context.__version__" }

[tool.setuptools]
# Only `aether_context` is distributed. `aether_agent/` also lives in this repo, but the
# `aether-agent` distribution on PyPI already owns that import path and the `aether` console
# script; shipping a second copy here would silently overwrite the other package's files on
# any machine that installed both. The agent stays in-repo (and importable in the test suite,
# which runs `python -m pytest` from the repo root) but out of the wheel.
packages = ["aether_context"]

[tool.setuptools.package-data]
aether_context = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", "*.egg-info", "build", "dist"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# No pinned python_version: mypy analyses under the interpreter running it, which is what
# the CI matrix already varies. Pinning it to the floor made mypy parse the *installed*
# numpy stubs under 3.10 syntax rules, so numpy >= 2.5 (whose stubs use PEP 695 `type`
# statements) failed to parse on every 3.12/3.13 job. The 3.10 matrix leg still enforces
# 3.10 compatibility.
ignore_missing_imports = true
